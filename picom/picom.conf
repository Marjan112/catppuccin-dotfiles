backend = "glx";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

shadows = true;
shadow-radius = 7;
shadows-offset-x = -7;
shadows-offset-y = -7;

corner-radius = 12;

unredir-if-possible = true;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'i3bar'"    
]
